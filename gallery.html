<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея | Малинина Марина Сергеевна</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Стили сетки фотографий */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 20px;
            height: 250px;
            position: relative;
            padding: 0 !important;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        /* Выплывающая подпись при наведении */
        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
            color: #ffffff;
            padding: 20px 15px 10px 15px;
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .gallery-item:hover .gallery-caption:not(:empty) {
            opacity: 1;
            transform: translateY(0);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--accent-lime);
        }

        /* Стили для полноэкранного модального окна (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .lightbox-img-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 90%;
            max-height: 80vh;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
            transition: opacity 0.2s ease;
        }

        /* Кнопка закрытия */
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            z-index: 2010;
        }

        .lightbox-close:hover {
            color: var(--accent-lime);
        }

        /* Стрелки листания */
        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 2010;
        }

        .lightbox-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        /* Подпись под фото */
        .lightbox-caption-text {
            color: #ffffff;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: center;
            max-width: 80%;
            min-height: 1.5em;
        }

        @media (max-width: 768px) {
            .lightbox-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">TUTOR ALENINO</div>
        <ul class="nav-links" style="display: flex;">
            <li><a href="index.html">← На главную</a></li>
        </ul>
    </nav>

    <section class="section" style="padding-top: 120px; padding-bottom: 80px;">
        <div class="container">
            
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Вернуться на главную
            </a>

            <h1 class="section-title">Фотогалерея</h1>

            <div class="gallery-grid">
                <div class="glass gallery-item">
                    <img src="i1.jpeg" alt="">
                    <div class="gallery-caption"></div>
                </div>
                <div class="glass gallery-item">
                    <img src="i2.jpeg" alt="Нейроигры">
                    <div class="gallery-caption">Нейроигры</div>
                </div>
                <div class="glass gallery-item">
                    <img src="i3.jpeg" alt="Рабочие материалы">
                    <div class="gallery-caption">Рабочие материалы</div>
                </div>
                <div class="glass gallery-item">
                    <img src="i4.jpg" alt="Уроки чистописания">
                    <div class="gallery-caption">Уроки чистописания</div>
                </div>
                <div class="glass gallery-item">
                    <img src="i5.jpg" alt="">
                    <div class="gallery-caption"></div>
                </div>  
                <div class="glass gallery-item">
                    <img src="i6.jpg" alt="">
                    <div class="gallery-caption"></div>
                </div>
                <div class="glass gallery-item">
                    <img src="i7.jpg" alt="">
                    <div class="gallery-caption"></div>
                </div>  
                <div class="glass gallery-item">
                    <img src="i8.jpg" alt="">
                    <div class="gallery-caption"></div>
                </div>  
                <div class="glass gallery-item">
                    <img src="i9.png" alt="">
                    <div class="gallery-caption"></div>
                </div>  
                <div class="glass gallery-item">
                    <img src="i10.jpg" alt="">
                    <div class="gallery-caption"></div>
                </div>  

            </div>

        </div>
    </section>

    <!-- Модальное окно для просмотра -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        
        <button class="lightbox-btn lightbox-prev" id="lightboxPrev" aria-label="Предыдущая">
            <i class="fas fa-chevron-left"></i>
        </button>
        
        <div class="lightbox-img-wrapper">
            <img class="lightbox-img" id="lightboxImg" src="" alt="Просмотр">
        </div>

        <button class="lightbox-btn lightbox-next" id="lightboxNext" aria-label="Следующая">
            <i class="fas fa-chevron-right"></i>
        </button>

        <div class="lightbox-caption-text" id="lightboxCaption"></div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Все права защищены.</p>
        </div>
    </footer>

    <!-- Скрипт галереи и переключения фото -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');
        const galleryItems = Array.from(document.querySelectorAll('.gallery-item'));

        let currentIndex = 0;

        // Функция обновления фото в модальном окне
        function updateLightbox(index) {
            if (index < 0) index = galleryItems.length - 1;
            if (index >= galleryItems.length) index = 0;
            
            currentIndex = index;

            const currentImg = galleryItems[currentIndex].querySelector('img');
            const altText = currentImg.getAttribute('alt') || '';

            lightboxImg.style.opacity = '0.3';
            setTimeout(() => {
                lightboxImg.src = currentImg.src;
                lightboxCaption.textContent = altText;
                lightboxImg.style.opacity = '1';
            }, 100);
        }

        // Открытие по клику на карточку
        galleryItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                lightbox.style.display = 'flex';
                updateLightbox(index);
            });
        });

        // Кнопки Назад / Вперед
        lightboxPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            updateLightbox(currentIndex - 1);
        });

        lightboxNext.addEventListener('click', (e) => {
            e.stopPropagation();
            updateLightbox(currentIndex + 1);
        });

        // Закрытие по крестику
        lightboxClose.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });

        // Закрытие по клику на фон
        lightbox.addEventListener('click', (e) => {
            if (
                e.target === lightbox || 
                e.target.classList.contains('lightbox-img-wrapper')
            ) {
                lightbox.style.display = 'none';
            }
        });

        // Управление с клавиатуры (стрелки + Esc)
        document.addEventListener('keydown', (e) => {
            if (lightbox.style.display === 'flex') {
                if (e.key === 'ArrowLeft') updateLightbox(currentIndex - 1);
                if (e.key === 'ArrowRight') updateLightbox(currentIndex + 1);
                if (e.key === 'Escape') lightbox.style.display = 'none';
            }
        });

        // Поддержка свайпов для телефонов
        let touchStartX = 0;
        let touchEndX = 0;

        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    updateLightbox(currentIndex + 1); // Свайп влево — следующее фото
                } else {
                    updateLightbox(currentIndex - 1); // Свайп вправо — предыдущее фото
                }
            }
        }
    </script>

</body>
</html>
